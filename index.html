<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Social links profile</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="background">
      <div class="main-container">
        <div><img class="photo" src="./50328156.png" /></div>
        <div class="description-text">
          <h1 style="color: white">George Koxenoglou</h1>
          <p style="font-weight: bold; color: rgb(174, 211, 116)">
            Athens, Greece

        <div class="social-links">
          <nav>
            <ul class="social-links-list">
              <li>
                <a href="https://github.com/GeoKoxe" target="_blank"
                  ><button class="button-40" role="button">GitHub</button></a
                >
              </li>
              <li>
                <a
                  href="https://www.linkedin.com/in/george-koxenoglou/"
                  target="_blank"
                  ><button class="button-40" role="button">LinkedIn</button></a
                >
              </li>
              <li>
                <a
                  href="https://geokoxe.github.io/portfolio-website/"
                  target="_blank"
                  ><button class="button-40" role="button">Website</button></a
                >
              </li>
              <li>
                <a href="https://www.frontendmentor.io/home" target="_blank"
                  ><button class="button-40" role="button">
                    Frontend Mentor
                  </button></a
                >
              </li>
            </ul>
          </nav>
        </div>
        <div class="attribution">
          Challenge by
          <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
            >Frontend Mentor</a
          >. Coded by <a href="#">Your Name Here</a>.
        </div>
      </div>
    </div>
